<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Post</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <header class="page-header">
        <h1>Create a New Post</h1>
    </header>

    <form class="form-card" action="{{ url_for('add_post') }}" method="POST">
        <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" name="author" required placeholder="Enter author's name">
        </div>

        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required placeholder="Enter post title">
        </div>

        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" required placeholder="Write your post content..."></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Post</button>
            <a class="btn" href="{{ url_for('index') }}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
