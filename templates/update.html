<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update the Post</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <header class="page-header">
        <h1>Update Blog Post</h1>
    </header>

    <form class="form-card" action="{{ url_for('update_post', id=post.id) }}" method="POST">
        <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" name="author" value="{{ post.author }}" required>
        </div>

        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="{{ post.title }}" required>
        </div>

        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" required>{{ post.content }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update</button>
            <a class="btn" href="{{ url_for('index') }}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
